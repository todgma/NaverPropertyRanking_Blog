name: Release Windows application

on:
  push:
    tags:
      - "v*"
      - "NaverPropertyRanking_Blog-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PROJECT: src/NaverPropertyRanking_Blog/NaverPropertyRanking_Blog.csproj
      TEST_PROJECT: tests/NaverPropertyRanking_Blog.SmokeTests/NaverPropertyRanking_Blog.SmokeTests.csproj
      DIST: ${{ github.workspace }}\dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version and prepare external configuration
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}" -replace '^NaverPropertyRanking_Blog-v', '' -replace '^[vV]', ''
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Copy-Item src/NaverPropertyRanking_Blog/appsettings.example.json src/NaverPropertyRanking_Blog/appsettings.json
          $settings = Get-Content src/NaverPropertyRanking_Blog/appsettings.json -Raw | ConvertFrom-Json
          $settings.Update.CurrentVersion = $version
          $settings | ConvertTo-Json -Depth 20 | Set-Content src/NaverPropertyRanking_Blog/appsettings.json -Encoding UTF8

      - name: Restore
        run: dotnet restore $env:TEST_PROJECT

      - name: Build and run smoke tests
        shell: pwsh
        run: |
          dotnet build $env:TEST_PROJECT -c Release --no-restore -p:Version=$env:APP_VERSION
          dotnet run --project $env:TEST_PROJECT -c Release --no-build

      - name: Publish single-file application
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true `
            -p:Version=$env:APP_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:PublishDir="$env:DIST\"
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "NaverPropertyRanking_Blog-v$env:APP_VERSION"
          } else {
            "${{ github.ref_name }}"
          }
          gh release create $tag "$env:DIST\NaverPropertyRanking_Blog.exe" `
            --title $tag --generate-notes
